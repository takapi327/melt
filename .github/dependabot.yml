# Dependabot configuration for automated dependency update PRs.
#
# Covers the ecosystems Dependabot supports natively: GitHub Actions and npm
# (pnpm workspaces included). Scala / sbt dependencies are NOT covered here
# (Dependabot does not understand sbt builds) and are updated manually for now.
version: 2
updates:
  # GitHub Actions used by ci.yml / deploy-docs.yml / clean.yml / release.yml.
  # Keeps pinned action major versions current (addresses version drift between
  # workflows, e.g. checkout/setup-java lagging in deploy-docs.yml).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # pnpm workspace at the repo root (root, docs, packages/*, examples/*).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    # TypeScript is held at 5.x. packages/vite-plugin builds its .d.ts with
    # `tsup --dts`, which bundles rollup-plugin-dts 6.x; that reads TypeScript
    # internals removed in 7.0 and dies with "Cannot read properties of
    # undefined (reading 'useCaseSensitiveFileNames')". tsup's peer range is
    # >=4.5.0, so nothing stops the install — only the build fails. Drop this
    # once tsup ships a TypeScript 7 compatible dts pipeline.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # VS Code extension — standalone npm project, not part of the pnpm workspace.
  - package-ecosystem: "npm"
    directory: "/editors/vscode"
    schedule:
      interval: "weekly"
    groups:
      vscode:
        patterns: ["*"]
