services:
  mysql:
    image: mysql:8.4.7
    container_name: melt-ldbc-fullstack-mysql
    environment:
      MYSQL_USER: 'ldbc'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      - 13306:3306
    volumes:
      - ./sql/world.sql:/docker-entrypoint-initdb.d/01-world.sql
      - ./sql/grants.sql:/docker-entrypoint-initdb.d/99-grants.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
