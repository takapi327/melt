# Melt formatter configuration — the single config for `.melt` files.
# Used by `sbt meltFmt` / `sbt meltFmtCheck`.
#
# `include` reuses the project's scalafmt settings for the <script> Scala, so you
# manage `.melt` formatting from here and `.scala` files from `.scalafmt.conf`.
include ".scalafmt.conf"

melt {
  template {
    # "inline"   → <p>hello</p>
    # "expanded" → <p>\n  hello\n</p>
    content = expanded
  }
}
